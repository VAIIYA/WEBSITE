  </defs>
  <rect width="1024" height="500" fill="url(#sky)"/>
  <circle cx="835" cy="120" r="180" fill="#ffffff" opacity="0.12"/>
  <circle cx="120" cy="430" r="220" fill="#ffffff" opacity="0.08"/>

