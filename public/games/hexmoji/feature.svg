  <text x="74" y="290" font-size="30" fill="#ffffff" opacity="0.9" font-family="'Courier New', monospace" letter-spacing="1">Kawaii hexxagon. Claim the board.</text>
  <g transform="translate(74 330)" font-family="'Courier New', monospace" font-size="20" fill="#1F1F1F">
