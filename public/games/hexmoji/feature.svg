    <circle cx="0" cy="0" r="24" fill="#1F1F1F"/>
    <circle cx="-9" cy="-4" r="6" fill="#fff"/><circle cx="9" cy="-4" r="6" fill="#fff"/>
    <circle cx="122" cy="0" r="24" fill="#1F1F1F"/>
    <circle cx="113" cy="-4" r="6" fill="#fff"/><circle cx="131" cy="-4" r="6" fill="#fff"/>
